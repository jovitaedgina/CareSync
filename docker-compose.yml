version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: caresync_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: caresync_db
    ports:
      - "5432:5432"
    volumes:
      - caresync_db_data:/var/lib/postgresql/data

volumes:
  caresync_db_data: